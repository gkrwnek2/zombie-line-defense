<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부대 도감</title>
<meta name="description" content="좀비 라인 디펜스 — 모든 부대의 조합법과 능력을 한 곳에서">
<meta name="theme-color" content="#11130d">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;600&family=Saira+Stencil+One&display=swap">
<style>
:root{
  --bg:#efe9d6; --bg2:#e6dfc7; --ink:#1c1f12; --dim:#4c4b37; --mute:#6c6a52; --line:#cdc4a4; --line2:#a99f7c;
  --olive:#56642a; --khaki:#6e5f22; --amber:#9a6200; --link:#3f4d12; --hl:#f2d98a;
  --phys:#b4521c; --magic:#2f6d93; --pierce:#8a6a00; --mix:#000;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-head:"Black Han Sans","Pretendard Variable","Malgun Gothic",sans-serif;
  --f-num:Oswald,"Pretendard Variable",sans-serif;
  --f-sten:"Saira Stencil One",Oswald,"Black Han Sans",sans-serif;
  --haz:repeating-linear-gradient(-45deg,#e0a526 0 8px,#16170f 8px 16px);
  --bar:112px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#11130d; --bg2:#1a1d13; --ink:#e4dcc0; --dim:#b5b095; --mute:#8d8b70; --line:#2c3223; --line2:#454d36;
  --olive:#9aad4c; --khaki:#c9b97f; --amber:#e8b040; --link:#d9cf9f; --hl:#5a4a12;
  --phys:#f0955e; --magic:#86b8d6; --pierce:#e8c04e; --mix:#fff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#11130d; --bg2:#1a1d13; --ink:#e4dcc0; --dim:#b5b095; --mute:#8d8b70; --line:#2c3223; --line2:#454d36;
  --olive:#9aad4c; --khaki:#c9b97f; --amber:#e8b040; --link:#d9cf9f; --hl:#5a4a12;
  --phys:#f0955e; --magic:#86b8d6; --pierce:#e8c04e; --mix:#fff; color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
.tc{color:color-mix(in srgb,var(--tc) 55%,#000)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tc{color:var(--tc)}}
:root[data-theme="dark"] .tc{color:var(--tc)}

/* 머리 */
.top{position:relative;padding:30px 0 18px;border-bottom:1px solid var(--line2)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--haz)}
.kick{font-family:var(--f-num);font-weight:500;font-size:15px;letter-spacing:.14em;color:var(--khaki);margin:6px 0 2px}
h1{font-family:var(--f-head);font-weight:400;font-size:34px;line-height:1.1;margin:0;letter-spacing:.01em}
.lead{margin:8px 0 0;color:var(--dim);font-size:16px}
.theme{position:absolute;right:0;top:30px;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--dim);font:600 15px var(--f-body);padding:4px 0;cursor:pointer}

/* 한눈에 보기 */
.sum{padding:16px 0 6px;border-bottom:1px solid var(--line2)}
.sum h2{font-family:var(--f-head);font-weight:400;font-size:20px;margin:0 0 4px}
.sum p.note{margin:0 0 10px;color:var(--mute);font-size:15px}
.cov{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;margin:0 0 14px;padding:0;list-style:none}
.cov li{border-bottom:1px solid var(--line)}
.cov button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;align-items:baseline;width:100%;padding:8px 0 7px;cursor:pointer;font-size:15px;position:relative}
.cov button b{font-family:var(--f-num);font-weight:600;font-size:17px}
.cov button i{position:absolute;left:0;bottom:-1px;height:3px;background:var(--olive);opacity:.75}
.cov button[aria-pressed="true"]{color:var(--amber)} .cov button[aria-pressed="true"] i{background:var(--amber);opacity:1}
.cov .rl i{background:var(--rc)}
.views{display:flex;gap:18px;margin:4px 0 10px;flex-wrap:wrap}
.views button{all:unset;cursor:pointer;font:700 16px var(--f-body);color:var(--mute);padding:4px 0;border-bottom:3px solid transparent}
.views button[aria-pressed="true"]{color:var(--ink);border-color:var(--amber)}

/* 붙는 검색줄 */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line2);padding:10px 0 0}
.srch{display:flex;align-items:center;gap:10px}
.srch input{flex:1;min-width:0;font:500 16px var(--f-body);color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:0;padding:10px 12px;outline:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.srch input:focus{border-color:var(--amber)}
.srch button{all:unset;cursor:pointer;font:600 15px var(--f-body);color:var(--dim);border-bottom:1px solid var(--line2)}
.status{font-size:15px;color:var(--amber);margin:6px 0 0;min-height:0}
.status:empty{display:none}
.tjump{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:6px 0 0;padding:2px 0 0;-webkit-overflow-scrolling:touch}
.tjump::-webkit-scrollbar{display:none}
.tjump a{flex:0 0 auto;text-decoration:none;font:700 16px var(--f-body);padding:4px 0 8px;border-bottom:3px solid var(--tc);white-space:nowrap}
.tjump a small{font:500 15px var(--f-num);color:var(--mute);margin-left:3px}
.tjump a.off{opacity:.35}

/* 등급 띠 */
.tier{padding-bottom:10px;scroll-margin-top:var(--bar)}
.th{position:sticky;top:var(--bar);z-index:10;margin:0;background:var(--bg);display:flex;align-items:baseline;gap:10px;padding:14px 0 8px;border-bottom:3px solid var(--tc);font-family:var(--f-head);font-weight:400;font-size:24px;line-height:1.1}
.th .no{font-family:var(--f-sten);font-size:22px;color:var(--mute)}
.th .cnt{font:500 15px var(--f-body);color:var(--mute);margin-left:auto}
.tsub{margin:8px 0 0;font-size:15px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr;column-gap:36px}

/* 유닛 한 칸 */
.u{padding:18px 0 20px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--bar) + 56px);min-width:0}
.u.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%,30%{background:var(--hl)}100%{background:transparent}}
.uh{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:start}
.ic{width:60px;height:60px;image-rendering:auto;background:var(--bg2);border-bottom:3px solid var(--tc)}
.uh h3{font-family:var(--f-head);font-weight:400;font-size:22px;line-height:1.15;margin:2px 0 3px;word-break:keep-all}
.meta{margin:0;font-size:15px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meta .tn{font-weight:700}
.dt-phys{color:var(--phys)} .dt-magic{color:var(--magic)} .dt-pierce{color:var(--pierce)}
.meta .dt{font-weight:700}
.tag{display:inline-block;font:700 15px/1.3 var(--f-body);padding:1px 7px 1px 6px;border-left:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 20%,transparent);color:var(--ink)}
.tag.sub{font-weight:500;background:transparent;border-left-width:2px}
.stat{margin:3px 0 0;font:500 15px var(--f-num);letter-spacing:.02em;color:var(--mute)}
.stat b{color:var(--dim);font-weight:600}
.u h4{margin:14px 0 6px;font:700 15px var(--f-body);color:var(--khaki);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.u h4::after{content:"";flex:1;border-top:1px dashed var(--line2)}
.ing{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin:0;padding:0;list-style:none}
.ing li{display:flex;align-items:center;gap:6px}
.ing li+li::before{content:"+";color:var(--mute);font:600 17px var(--f-num);margin-right:2px}
.go{display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;text-decoration-thickness:2px;font-weight:600;color:var(--link);min-height:36px}
.go:hover,.go:focus-visible{text-decoration-color:var(--amber)}
.go img{width:30px;height:30px;background:var(--bg2)}
/* S33: 신화·초월·히든 그림에 박힌 옛 등급 테두리(옛 색)를 잘라냄 — 등급색은 아래 선·글자로 보여줌 */
img.rg{clip-path:circle(41% at 50% 50%)}
.go.hit{background:var(--hl)}
.x2{font:600 15px var(--f-num);color:var(--amber)}
.cost{margin:8px 0 0;font-size:15px;color:var(--dim)}
.cost b{color:var(--ink)}
.cost .sum2{font-weight:700;color:var(--ink);white-space:nowrap}
.into{margin:8px 0 0;font-size:15px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.into > span{color:var(--mute)}
.into .go img{width:26px;height:26px}
.note2{margin:8px 0 0;font-size:15px;color:var(--amber)}
.solo{margin:0;font-size:15px;color:var(--dim)}
.ab{margin:0;padding:0;list-style:none}
.ab li{font-size:15px;padding:3px 0 3px 0;color:var(--dim)}
.ab li b{color:var(--ink);margin-right:6px}
.sk{padding:8px 0 8px 12px;border-left:3px solid var(--line2);margin:6px 0 0}
.sk .nm{font-family:var(--f-head);font-weight:400;font-size:18px;line-height:1.2;margin:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sk .cat{font:700 15px var(--f-body);color:var(--amber)}
.sk p{margin:3px 0 0;font-size:15px;color:var(--dim)}
.sk p span{display:inline-block;min-width:2.6em;color:var(--mute);font-weight:600}
.sk p.what{color:var(--ink)}
.empty{padding:28px 0;color:var(--mute);font-size:16px}
.foot{padding:26px 0 40px;color:var(--mute);font-size:15px;border-top:1px solid var(--line2);margin-top:12px}
.foot b{color:var(--dim)}
body.v-craft .abil{display:none} body.v-skill .craft{display:none}

@media (min-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cov{grid-template-columns:repeat(3,1fr)}
  h1{font-size:40px}
}
@media (min-width:1140px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cov{grid-template-columns:repeat(5,1fr)}
}

/* 이미지용(공유 사진) */
body.shot .top,body.shot .sum,body.shot .bar,body.shot .foot,body.shot .views{display:none}
body.shot .th{position:static}
body.shot .wrap{padding:0 20px}
body.shot .shead{display:block}
.shead{display:none;position:relative;padding:22px 0 8px}
.shead::before{content:"";position:absolute;left:-20px;right:-20px;top:0;height:7px;background:var(--haz)}
.shead p{margin:6px 0 0;font:500 15px var(--f-num);letter-spacing:.12em;color:var(--khaki)}
.sfoot{display:none;padding:14px 0 22px;font-size:15px;color:var(--mute)}
body.shot .sfoot{display:block}
body.shot .grid{grid-template-columns:1fr}
body.shot .go{text-decoration:none}
</style>
</head>

function tierHead(t,extra){
  var sub=t.n+'종';
  var line=t.note||((t.no===1?'소환으로만 얻는 기본 부대':'흔함 '+(t.cMin===t.cMax?t.cMin:t.cMin+'~'+t.cMax)+'개가 모여 한 부대')+(t.odds?' · 소환 확률 '+pct(t.odds):'')+(t.skillN?' · 등급 스킬 '+t.skillN+'개':''));
  return '<h2 class="th" style="--tc:'+t.color+'"><span class="no">'+String(t.no).padStart(2,'0')+'</span><span class="tc">'+esc(t.name)+'</span><span class="cnt">'+(extra||sub)+'</span></h2><p class="tsub">'+line+'</p>';
}

if(SHOT){
  // 공유 사진용: 한 등급(일부)만
  document.body.classList.add('shot','v-'+SHOT);
  var t=T[P.get('tier')]||D.tiers[0];
  var list=U.filter(function(u){return u.tier===t.t;});
  var from=+(P.get('from')||0),to=P.get('to')!=null?+P.get('to'):list.length;
  var part=P.get('part'),parts=P.get('parts');
  document.getElementById('shead').innerHTML='<h1>'+(SHOT==='craft'?'조합표':'능력표')+'</h1><p>ZOMBIE LINE DEFENSE · 부대 도감</p>';
  main.insertAdjacentHTML('beforeend','<section class="tier" style="--tc:'+t.color+'">'+tierHead(t,parts>1?part+' / '+parts+' 장':t.n+'종')+'<div class="grid">'+list.slice(from,to).map(card).join('')+'</div></section><p class="sfoot">'+esc(D.stamp)+' 게임 파일에서 자동 생성 · 전체 목록과 찾기는 부대 도감 웹페이지에서</p>');
  document.querySelectorAll('img').forEach(function(im){im.loading='eager';});
  return;
}

// 전체 페이지
var html='';
D.tiers.forEach(function(t){
  html+='<section class="tier" id="t-'+t.t+'" style="--tc:'+t.color+'">'+tierHead(t)+'<div class="grid">'+U.filter(function(u){return u.tier===t.t;}).map(card).join('')+'</div></section>';
});
html+='<p class="empty" id="none" hidden>찾는 부대가 없어요. 이름 일부만 넣어 보세요 (예: 흑표, 드론).</p>';
main.insertAdjacentHTML('beforeend',html);
document.getElementById('tjump').innerHTML=D.tiers.map(function(t){return '<a href="#t-'+t.t+'" data-t="'+t.t+'" style="--tc:'+t.color+'">'+esc(t.name)+'<small>'+t.n+'</small></a>';}).join('');

// 한눈에 보기
var s='<div class="views" role="group" aria-label="보기 방식"><button type="button" data-v="all" aria-pressed="true">전부</button><button type="button" data-v="craft" aria-pressed="false">조합만</button><button type="button" data-v="skill" aria-pressed="false">능력만</button></div>';
s+='<h2>한눈에 보기</h2><p class="note">부대 '+U.length+'종. 항목을 누르면 그 부대만 모아 봐요.</p>';
if(D.hasRoles){
  s+='<p class="note" style="margin-top:6px"><b style="color:var(--ink)">역할별</b> — 주역할 수 / 겸하는 부대까지 합친 수</p><ul class="cov">'+D.roleCover.map(function(r){var m=D.roleCover[0].n||1;return '<li class="rl" style="--rc:'+rc(r.r)+'"><button type="button" data-role="'+esc(r.r)+'" aria-pressed="false"><span>'+esc(r.r)+'</span><b>'+r.main+(r.n>r.main?' / '+r.n:'')+'</b><i style="width:'+Math.round(r.n/m*100)+'%"></i></button></li>';}).join('')+'</ul>';
}
var mx=Math.max.apply(null,D.cover.map(function(c){return c.n;}));
s+='<p class="note" style="margin-top:6px"><b style="color:var(--ink)">효과별</b> — 그 효과를 가진 부대 수 (기본 능력 + 스킬)</p><ul class="cov">'+D.cover.map(function(c){return '<li><button type="button" data-fx="'+esc(c.c)+'" aria-pressed="false" title="기본 '+c.b+' · 스킬 '+c.s+'"><span>'+esc(c.c)+'</span><b>'+c.n+'</b><i style="width:'+Math.round(c.n/mx*100)+'%"></i></button></li>';}).join('')+'</ul>';
if(D.zarm){var Z=D.zarm;s+='<p class="note" style="margin-top:10px"><b style="color:var(--ink)">좀비 방어력</b> — 30웨이브 기준 방어 / 마방 점수. 방깎·마방깎 합계가 이만큼이면 방어력 0 (최대 '+Z.full+'점 = 풀깎). 방어 100이면 피해 약 1/7</p>'
  +'<div style="overflow-x:auto"><table class="zt" style="border-collapse:collapse;font-size:12.5px;margin-top:4px"><tr><th style="text-align:left;padding:3px 8px">좀비</th>'+Z.diffs.map(function(x){return '<th style="padding:3px 8px">'+esc(x.d)+'</th>';}).join('')+'</tr>'
  +Z.rows.map(function(r){return '<tr style="border-top:1px dashed var(--line,#444)"><td style="padding:3px 8px">'+esc(r.nm)+'</td>'+r.v.map(function(v){return '<td style="padding:3px 8px;text-align:center;font-variant-numeric:tabular-nums">'+v[0]+' / '+v[1]+'</td>';}).join('')+'</tr>';}).join('')
  +'<tr style="border-top:1px solid var(--line,#444)"><td style="padding:3px 8px">필요 깎기</td>'+Z.diffs.map(function(x){return '<td style="padding:3px 8px;text-align:center">'+(x.need?x.need+'점':'없어도 OK')+'</td>';}).join('')+'</tr>'
  +'<tr><td style="padding:3px 8px">한 바퀴 회복</td>'+Z.diffs.map(function(x){return '<td style="padding:3px 8px;text-align:center">'+(x.lap?Math.round(x.lap*100)+'%':'없음')+'</td>';}).join('')+'</tr></table></div>';}
document.getElementById('sum').innerHTML=s;
document.getElementById('foot').innerHTML='<b>'+esc(D.stamp)+'</b> 게임 파일('+esc(D.source)+') 기준으로 자동 생성. 게임이 바뀌면 <b>node 자료/make_ref.js</b> 한 번이면 새로 만들어져요.';

// 걸러보기
var st={q:'',role:null,fx:null};
var cards=[].slice.call(document.querySelectorAll('#main .u'));
var qEl=document.getElementById('q'),stEl=document.getElementById('status');
function apply(){
  var q=norm(st.q),shown=0,perTier={};
  cards.forEach(function(el){
    var u=U[+el.id.slice(1)],ok=true;
    el.querySelectorAll('.ing li').forEach(function(li){li.firstChild&&li.firstChild.classList&&li.firstChild.classList.remove('hit');});
    if(q){
      var m=norm(u.name).indexOf(q)>=0||norm(u.short).indexOf(q)>=0;
      el.querySelectorAll('.ing li').forEach(function(li){if(li.getAttribute('data-ing').split('|').some(function(x){return x&&x.indexOf(q)>=0;})){m=true;var a=li.querySelector('.go');if(a)a.classList.add('hit');}});
      ok=m;
    }
    if(ok&&st.role)ok=u.role===st.role||u.roles.indexOf(st.role)>=0;
    if(ok&&st.fx)ok=u.fx.indexOf(st.fx)>=0;
    el.hidden=!ok;if(ok){shown++;perTier[u.tier]=(perTier[u.tier]||0)+1;}
  });
  var filt=!!(st.q||st.role||st.fx);D.tiers.forEach(function(t){var sec=document.getElementById('t-'+t.t);sec.hidden=!perTier[t.t];sec.querySelector('.cnt').textContent=filt?(perTier[t.t]||0)+' / '+t.n+'종':t.n+'종';var a=document.querySelector('.tjump a[data-t="'+t.t+'"]');a.classList.toggle('off',!perTier[t.t]);a.querySelector('small').textContent=perTier[t.t]||0;});
  document.getElementById('none').hidden=shown>0;
  var bits=[];if(st.q)bits.push('"'+st.q+'"');if(st.role)bits.push('역할 '+st.role);if(st.fx)bits.push(st.fx);
  stEl.textContent=bits.length?bits.join(' · ')+' — '+shown+'종 찾음':'';
  document.querySelectorAll('[data-role]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-role')===st.role));});
  document.querySelectorAll('[data-fx]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-fx')===st.fx));});
  measure();
}
function toTop(){var f=document.querySelector('#main .tier:not([hidden])');if(f&&f.getBoundingClientRect().top<bar.offsetHeight)f.scrollIntoView({block:'start'});}
var tm;qEl.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){st.q=qEl.value.trim();apply();toTop();},150);});
document.getElementById('reset').addEventListener('click',function(){st={q:'',role:null,fx:null};qEl.value='';apply();});
document.getElementById('sum').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-v')){var v=b.getAttribute('data-v');document.body.classList.remove('v-craft','v-skill');if(v!=='all')document.body.classList.add('v-'+v);document.querySelectorAll('[data-v]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});try{localStorage.setItem('dogam-view',v);}catch(err){}return;}
  if(b.hasAttribute('data-role')){var r=b.getAttribute('data-role');st.role=st.role===r?null:r;}
  if(b.hasAttribute('data-fx')){var f=b.getAttribute('data-fx');st.fx=st.fx===f?null:f;}
  apply();var f0=document.querySelector('#main .tier:not([hidden])');f0&&f0.scrollIntoView({block:'start'});
});
try{var v0=localStorage.getItem('dogam-view');if(v0==='craft'||v0==='skill'){var vb=document.querySelector('[data-v="'+v0+'"]');vb&&vb.click();}}catch(e){}

// 재료·조합 누르면 그 부대로
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-go]');if(!a)return;
  e.preventDefault();
  var el=document.getElementById('u'+a.getAttribute('data-go'));if(!el)return;
  if(el.hidden||el.closest('.tier').hidden){st={q:'',role:null,fx:null};qEl.value='';apply();}
  var far=Math.abs(el.getBoundingClientRect().top)>innerHeight*2;el.scrollIntoView({block:'start',behavior:far?'auto':'smooth'});
  try{history.pushState(null,'','#'+el.id);}catch(err){}
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
});

// 화면 밝기
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  var nx=dark?'light':'dark';root.setAttribute('data-theme',nx);try{localStorage.setItem('dogam-theme',nx);}catch(e){}
});

// 붙는 검색줄 높이 → 등급 띠 위치
var bar=document.getElementById('bar');
function measure(){root.style.setProperty('--bar',bar.offsetHeight+'px');}
measure();if(window.ResizeObserver)new ResizeObserver(measure).observe(bar);
if(location.hash&&/^#u\d+$/.test(location.hash)){var h0=document.querySelector(location.hash);h0&&setTimeout(function(){h0.scrollIntoView({block:'start'});h0.classList.add('flash');},60);}
})();
</script>
</body>
</html>
