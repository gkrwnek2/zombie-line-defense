<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>A2 시험 — 눌러보는 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{
  --bg:#0a0d11;
  --panel:#181d25;
  --panel2:#10141b;
  --edge:#333c4a;
  --gold:#f2c14e;
  --green:#5fd97a;
  --red:#ff5d5d;
  --blue:#7ec8ff;
  --ink:#f3f5f8;
  --dim:#a7b0bf;
  --bottombar-h:228px;--topbar-h:104px; /* info-strip(160) + cmd-row(68) 고정 총합 — 선택 전후 안 바뀜 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0;}
html,body{margin:0;padding:0;background:#05060a;overscroll-behavior:none;overflow-x:hidden;width:100%;}
body{
  font-family:'Pretendard Variable','Pretendard',sans-serif;
  color:var(--ink);
  display:flex;justify-content:center;
  min-height:100vh;
}
button{font-family:inherit;border:none;background:none;color:inherit;padding:0;margin:0;}

/* ===== 폰 프레임: 모바일은 꽉 차게, PC는 375 폭 고정 ===== */
.stage{width:100%;max-width:375px;min-height:100vh;background:#000;position:relative;overflow:hidden;
  display:flex;flex-direction:column;}
@media (min-width:480px){
  body{align-items:center;padding:20px 0;}
  .stage{height:812px;min-height:812px;border-radius:26px;border:1px solid #333;box-shadow:0 20px 50px rgba(0,0,0,.6);}
}
/* 캡처 전용: ?shot=1 붙이면 뷰포트가 넓어도 좌측 상단에 375×812로 고정(검수 스크린샷용) */
body.shotmode{display:block!important;padding:0!important;}
body.shotmode .stage{position:absolute!important;top:0;left:0;width:375px!important;max-width:375px!important;height:812px!important;min-height:812px!important;border-radius:0!important;border:none!important;box-shadow:none!important;}
.screen{position:relative;flex:1;background:#10151c;min-height:0;overflow:hidden;}

/* ===== 눌러 반응 ===== */
.tap{transition:transform .08s ease;}
.tap:active{transform:scale(.94);}
@media (prefers-reduced-motion:reduce){.tap{transition:none;}.tap:active{transform:none;}}

/* ===== 상단 상태줄 (전장 위 반투명 얹기) ===== */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:8;
  padding:8px 8px 6px;
  display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(5,7,10,.82) 0%,rgba(5,7,10,.55) 70%,rgba(5,7,10,0) 100%);
}
.top-line1{display:flex;align-items:center;gap:6px;}
.top-line2{display:flex;align-items:center;justify-content:space-between;gap:5px;}

.zed-peek-btn{
  width:44px;height:44px;border-radius:10px;flex:0 0 auto;
  background:rgba(24,29,37,.88);border:1px solid var(--edge);overflow:hidden;position:relative;
}
.zed-peek-btn img{width:100%;height:100%;object-fit:contain;padding:4px;}
.wave-launch{
  display:flex;align-items:center;gap:5px;
  background:rgba(24,29,37,.88);border:1px solid var(--edge);border-radius:10px;
  padding:5px 7px;height:44px;min-width:0;flex:0 1 auto;overflow:hidden;
}
.wave-launch .wnum{font-family:'SUIT Variable';font-weight:900;font-size:17px;color:#fff;white-space:nowrap;line-height:1.05;flex:0 0 auto;}
.wave-launch .wnum small{font-size:9.5px;color:var(--gold);font-weight:700;display:block;margin-top:1px;font-family:'Pretendard Variable';}
.wave-launch .timer{font-family:'SUIT Variable';font-weight:800;font-size:11.5px;color:#cdd5e2;white-space:nowrap;border-left:1px solid #333c4a;padding-left:6px;flex:0 0 auto;}
.wave-launch .timer b{color:var(--gold);font-size:13px;}
.go-btn{
  background:var(--green);color:#08210f;font-weight:900;font-size:12.5px;
  padding:0 11px;border-radius:8px;white-space:nowrap;height:44px;display:flex;align-items:center;
  font-family:'SUIT Variable';min-width:44px;justify-content:center;flex:0 0 auto;
}
.speed-btn{
  background:rgba(24,29,37,.88);border:1px solid var(--edge);border-radius:9px;
  padding:0 10px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:var(--gold);white-space:nowrap;font-family:'SUIT Variable';flex:0 0 auto;
}
.pause-btn{
  width:44px;height:44px;border-radius:9px;flex:0 0 auto;
  background:rgba(42,32,21,.9);border:1px solid #5a4520;
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;font-weight:900;
}

.gold-pill{
  background:rgba(24,29,37,.88);border:1px solid var(--edge);border-radius:16px;
  padding:4px 9px 4px 6px;display:flex;align-items:center;gap:4px;
  font-weight:800;font-size:12.5px;height:28px;font-family:'SUIT Variable';color:#fff;white-space:nowrap;flex:0 0 auto;
}
.gold-pill .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe89a,#c99a1f);box-shadow:inset 0 0 0 1px #8a6a12;flex:0 0 auto;}
.zombie-pill{
  background:rgba(24,29,37,.88);border:1px solid var(--edge);border-radius:16px;
  padding:4px 7px;display:flex;align-items:center;gap:3px;
  font-weight:800;font-size:12px;height:28px;font-family:'SUIT Variable';color:#cdd5e2;white-space:nowrap;flex:0 0 auto;
}
.zombie-pill.danger{border-color:var(--red);color:var(--red);}
.zombie-pill .lbl{font-size:12px;color:var(--dim);font-weight:700;font-family:'Pretendard Variable';margin-right:1px;}
.zombie-pill.danger .lbl{color:#ff9d9d;}
.boss-pill{
  background:rgba(24,29,37,.88);border:1px solid var(--edge);border-radius:16px;
  padding:4px 7px;display:flex;align-items:center;gap:3px;
  font-weight:700;font-size:12px;height:28px;color:#cdd5e2;white-space:nowrap;flex:0 0 auto;
}
.mid-cluster{display:flex;align-items:center;gap:5px;flex:1 1 auto;justify-content:flex-start;min-width:0;overflow:hidden;}
.right-cluster{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.badge-btn{
  position:relative;height:44px;border-radius:9px;flex:0 0 auto;
  background:rgba(24,29,37,.88);border:1px solid var(--edge);
  display:flex;align-items:center;justify-content:center;gap:3px;color:#e8ecf1;
  padding:0 7px;
}
.badge-btn svg{width:14px;height:14px;flex:0 0 auto;}
.badge-btn .bl{font-size:12px;font-weight:700;color:#cdd5e2;white-space:nowrap;}
.badge-btn .cnt{
  position:absolute;top:-6px;right:-6px;
  background:var(--gold);color:#231a04;font-size:9.5px;font-weight:900;
  min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  border:1px solid #05060a;font-family:'SUIT Variable';
}
.zed-tip-hit{position:absolute;top:0;left:0;width:44px;height:44px;z-index:2;}

/* ===== 적 미리보기 작은 카드 ===== */
.zpreview-card{
  position:absolute;top:78px;left:8px;z-index:12;
  background:rgba(10,12,16,.96);border:1px solid var(--edge);border-radius:10px;
  padding:10px 12px;width:200px;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.zpreview-card .zp-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.zpreview-card .zp-portrait{width:36px;height:36px;border-radius:7px;overflow:hidden;background:#0a0c10;border:1px solid #333;flex:0 0 auto;}
.zpreview-card .zp-portrait img{width:100%;height:100%;object-fit:contain;}
.zpreview-card .zp-name{font-family:'SUIT Variable';font-weight:900;font-size:15px;color:#fff;}
.zpreview-card .zp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:12px;color:var(--dim);}
.zpreview-card .zp-grid b{color:#e8ecf1;font-weight:800;}
.zpreview-card .zp-trait{margin-top:6px;font-size:12px;color:var(--gold);line-height:1.4;border-top:1px solid #262c36;padding-top:6px;}

/* ===== 특수 유닛/미션 팝업 목록(간단) ===== */
.pop-sheet{
  position:absolute;inset:0;z-index:15;background:rgba(5,6,9,.92);
  display:flex;flex-direction:column;
}
.pop-head{padding:16px 14px 10px;border-bottom:1px solid #2c3340;display:flex;align-items:center;gap:10px;}
.pop-head .t{font-family:'SUIT Variable';font-weight:900;font-size:20px;color:#fff;flex:1;}
.pop-head .x{width:36px;height:36px;border-radius:50%;background:#242a34;display:flex;align-items:center;justify-content:center;color:#c3cad8;flex:0 0 auto;}
.pop-body{flex:1;overflow-y:auto;padding:10px 14px 16px;}
.pick-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #23293280;}
.pick-row:last-child{border-bottom:none;}
.pick-row .pimg{width:40px;height:40px;border-radius:7px;background:#0a0c10;border:1px solid #333;flex:0 0 auto;overflow:hidden;}
.pick-row .pimg img{width:100%;height:100%;object-fit:contain;}
.pick-row .pname{flex:1;font-size:14px;font-weight:800;color:#eef1f5;}
.pick-row .ptag{font-size:11.5px;color:var(--dim);margin-top:2px;}
.pick-row .pgo{background:var(--green);color:#08210f;font-weight:900;font-size:12.5px;padding:8px 12px;border-radius:7px;font-family:'SUIT Variable';min-height:44px;display:flex;align-items:center;}

/* ===== 게임판 ===== */
/* 전장은 위(상태줄 뒤)부터 아래 조작부 바로 위까지만. 정보띠·명령줄은 이 아래 별도 고정 영역. */
.board-wrap{
  position:absolute;left:0;right:0;top:var(--topbar-h,104px);bottom:var(--bottombar-h,228px);
  overflow:hidden;background:#1a2a1f;
}
.board-wrap svg{width:100%;height:100%;display:block;}
.cell-tag{font-family:'SUIT Variable';font-weight:900;}
.dmg-float{position:absolute;font-family:'SUIT Variable';font-weight:900;font-size:12px;color:#ffe08a;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.6);pointer-events:none;z-index:6;}

/* ===== 아래 조작부 ===== */
.bottombar{
  position:absolute;left:0;right:0;bottom:0;z-index:9;height:var(--bottombar-h);
  background:linear-gradient(180deg,#171b22,#0c0f14);
  border-top:1px solid var(--edge);
  display:flex;flex-direction:column;
}
/* 정보띠: 선택 여부와 무관하게 항상 같은 높이 확보(전장을 덮지 않음) */
.info-strip{
  height:160px;flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 10px;border-bottom:1px solid #20252e;overflow:hidden;
}
.info-strip .peek-txt{flex:1;font-size:12.5px;color:#c3cad8;line-height:1.5;min-width:0;}
.info-strip .peek-txt b{color:var(--gold);}
/* 미선택 시 다음 웨이브 미리보기(그림+텍스트) */
.peek-full{display:flex;align-items:center;gap:10px;width:100%;}
.peek-full .pf-img{width:52px;height:52px;border-radius:9px;background:#0a0c10;border:1px solid #333;flex:0 0 auto;overflow:hidden;}
.peek-full .pf-img img{width:100%;height:100%;object-fit:contain;}
.peek-full .pf-txt{flex:1;min-width:0;}
.peek-full .pf-name{font-family:'SUIT Variable';font-weight:900;font-size:15px;color:#fff;}
.peek-full .pf-trait{font-size:12px;color:var(--gold);margin-top:4px;line-height:1.5;}
.peek-full .pf-sub{font-size:11.5px;color:var(--dim);margin-top:2px;}

/* 유닛 선택된 정보 띠: 160px 안에서 위(이름·스탯)/아래(조합 후보) 2단 고정 */
.sel-strip{display:flex;flex-direction:column;gap:6px;width:100%;height:100%;justify-content:center;}
.sel-top{display:flex;align-items:center;gap:8px;}
.sel-portrait{width:40px;height:40px;border-radius:8px;border:1px solid var(--edge);background:#0a0c10;overflow:hidden;flex:0 0 auto;position:relative;}
.sel-portrait img{width:100%;height:100%;object-fit:contain;}
.sel-main{flex:1;min-width:0;}
.sel-name-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.sel-name{font-family:'SUIT Variable';font-weight:900;font-size:15px;color:#fff;white-space:nowrap;}
.tier-chip{font-size:12px;font-weight:800;padding:1px 6px;border-radius:8px;white-space:nowrap;}
.sel-sub{font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sel-skill{font-size:12px;color:var(--gold);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sel-stats{display:flex;gap:9px;font-size:12px;color:var(--dim);white-space:nowrap;flex:0 0 auto;}
.sel-stats b{color:#eef1f5;font-weight:800;font-family:'SUIT Variable';font-size:12.5px;}
.side-actions{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;}
.mini-btn{width:34px;height:26px;border-radius:6px;background:#1c212a;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;color:#9aa4b2;}
.mini-btn svg{width:14px;height:14px;}
.mini-btn.disabled{opacity:.35;}
/* 상위 조합 후보 줄: 정보띠 하단 고정 */
.recipe-block{flex:0 0 auto;}
.recipe-block .rb-label{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:4px;}
.recipe-line{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:1px;}
.recipe-chip{display:flex;align-items:center;gap:5px;background:#161a21;border:1px solid #2a313d;border-radius:7px;padding:4px 8px 4px 5px;flex:0 0 auto;}
.recipe-chip.ready{border-color:#3d6b45;background:#132318;}
.recipe-chip img{width:22px;height:22px;object-fit:contain;flex:0 0 auto;}
.recipe-chip .rc-name{font-size:11.5px;font-weight:700;color:#c3cad8;white-space:nowrap;}
.recipe-chip .rc-cnt{font-size:12px;font-weight:800;color:var(--dim);font-family:'SUIT Variable';white-space:nowrap;}
.recipe-chip.ready .rc-cnt{color:var(--green);}
.recipe-empty{font-size:11.5px;color:var(--dim);}

/* 명령줄: 항상 동일 */
.cmd-row{
  flex:0 0 auto;
  display:grid;grid-template-columns:1.5fr 1fr 1fr 0.7fr;gap:7px;
  padding:8px 10px 10px;
}
.cmd-btn{
  height:52px;border-radius:9px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;font-weight:800;color:#eef1f5;
  background:#1c212a;border:1px solid var(--edge);
}
.cmd-btn svg{width:18px;height:18px;}
.cmd-btn .sub{font-size:12px;color:var(--dim);font-weight:700;}
.cmd-btn.summon{
  background:linear-gradient(180deg,#3a5228,#233016);border-color:#587a37;
}
.cmd-btn.summon .lbl{color:var(--green);font-size:14px;font-family:'SUIT Variable';font-weight:900;}
.cmd-btn.summon .sub{color:var(--gold);font-weight:800;}
.cmd-btn .cnt-badge{
  position:absolute;top:-6px;right:-6px;background:var(--gold);color:#231a04;
  font-size:10px;font-weight:900;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;border:1px solid #05060a;font-family:'SUIT Variable';
}
.cmd-btn.combo.armed{border-color:var(--gold);background:#241d10;}
.cmd-btn.combo .lbl{color:#8fd0ff;}
.cmd-btn.combo.armed .lbl{color:var(--gold);}
.cmd-btn.disabled{opacity:.4;}

/* 강화 팝업(작은 판) */
.enh-pop{
  position:absolute;left:10px;right:10px;bottom:118px;z-index:14;
  background:#161a21;border:1px solid var(--edge);border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.5);overflow:hidden;
}
.enh-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid #23293280;}
.enh-item:last-child{border-bottom:none;}
.enh-item .ic{width:34px;height:34px;border-radius:7px;background:#1c212a;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.enh-item .ic svg{width:18px;height:18px;color:var(--gold);}
.enh-item .et{flex:1;}
.enh-item .et .n{font-size:14px;font-weight:800;color:#eef1f5;}
.enh-item .et .d{font-size:11.5px;color:var(--dim);margin-top:1px;}
.enh-item .cost{font-size:13px;font-weight:800;color:var(--gold);font-family:'SUIT Variable';}

/* 더보기 팝업 */
.more-pop{
  position:absolute;left:10px;right:10px;bottom:118px;z-index:14;
  background:#161a21;border:1px solid var(--edge);border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.5);overflow:hidden;
}
.more-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid #23293280;font-size:14px;font-weight:800;color:#eef1f5;}
.more-item:last-child{border-bottom:none;}
.more-item svg{width:18px;height:18px;color:#9aa4b2;flex:0 0 auto;}

/* ===== 미션 창 ===== */
.mission-modal{position:absolute;inset:0;background:rgba(5,6,9,.95);display:flex;flex-direction:column;z-index:20;}
.mission-head{padding:16px 14px 10px;border-bottom:1px solid #2c3340;display:flex;align-items:center;gap:10px;}
.mission-head .t{font-family:'SUIT Variable';font-weight:900;font-size:21px;color:#fff;flex:1;}
.mission-head .x{width:36px;height:36px;border-radius:50%;background:#242a34;display:flex;align-items:center;justify-content:center;color:#c3cad8;flex:0 0 auto;}
.paused-chip{display:inline-flex;align-items:center;gap:5px;background:#241d10;border:1px solid #6b5220;color:var(--gold);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;margin-top:8px;}
.mission-list{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #23293280;}
.mrow:last-child{border-bottom:none;}
.mrow.locked{opacity:.45;}
.mrow .mimg{width:38px;height:38px;border-radius:7px;background:#0a0c10;border:1px solid #333;flex:0 0 auto;overflow:hidden;}
.mrow .mimg img{width:100%;height:100%;object-fit:contain;}
.mrow .txt{flex:1;min-width:0;}
.mrow .line1{font-size:14.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .line1 span{font-size:11.5px;font-weight:700;color:#8891a0;margin-left:6px;display:inline-flex;align-items:center;gap:3px;vertical-align:middle;}
.mrow .line1 span svg{width:11px;height:11px;flex:0 0 auto;}
.mrow .go.locked-btn svg{width:16px;height:16px;}
.mrow .line2{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mrow .line2 b{color:var(--gold);font-weight:700;}
.mrow .go{flex:0 0 auto;background:var(--green);color:#08210f;font-weight:900;font-size:12.5px;padding:9px 14px;border-radius:8px;font-family:'SUIT Variable';min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;}
.mrow .go.locked-btn{background:#2a2f38;color:#6b7280;}
.mission-done-fold{padding:8px 4px 4px;font-size:12px;color:var(--dim);font-weight:700;border-top:1px solid #262c36;margin-top:4px;}
.mission-close{margin:10px 14px 16px;background:#1c212a;border:1px solid var(--edge);color:#fff;font-weight:800;font-size:14.5px;padding:13px;border-radius:8px;text-align:center;font-family:'SUIT Variable';min-height:44px;}

.hidden{display:none!important;}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="screen" id="screen">

    <!-- 게임판 (항상 같은 위치·크기) -->
    <div class="board-wrap" id="boardWrap">
      <svg viewBox="0 0 320 460" id="boardSvg">
        <rect x="14" y="14" width="292" height="432" rx="6" fill="#213024" stroke="#3a5a3f" stroke-width="3"/>

const cellsLayer=document.getElementById('cellsLayer');
const zombieLayer=document.getElementById('zombieLayer');

function tierColor(t){return RARITY[t]?RARITY[t].color:'#888';}

function drawCells(){
  cellsLayer.innerHTML='';
  CELL_XY.forEach((xy,i)=>{
    const uname=CELL_UNIT[i];
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-cell',i);
    g.style.cursor='pointer';
    const [cx,cy]=xy;
    const box=document.createElementNS('http://www.w3.org/2000/svg','rect');
    box.setAttribute('x',cx-19);box.setAttribute('y',cy-19);
    box.setAttribute('width',38);box.setAttribute('height',38);
    box.setAttribute('rx',5);
    box.setAttribute('fill','#0e1a12');
    box.setAttribute('stroke','#3a4a2f');
    box.setAttribute('stroke-width','1.4');
    g.appendChild(box);

    if(uname){
      const u=U[uname];
      const img=document.createElementNS('http://www.w3.org/2000/svg','image');
      img.setAttribute('href',ASSET_UNIT(uname));
      img.setAttribute('x',cx-16);img.setAttribute('y',cy-16);
      img.setAttribute('width',32);img.setAttribute('height',32);
      img.setAttribute('preserveAspectRatio','xMidYMid meet');
      g.appendChild(img);

      // 등급 띠(칸 아래)
      const tier=document.createElementNS('http://www.w3.org/2000/svg','rect');
      tier.setAttribute('x',cx-19);tier.setAttribute('y',cy+15);
      tier.setAttribute('width',38);tier.setAttribute('height',4);
      tier.setAttribute('rx',2);
      tier.setAttribute('fill',tierColor(u.t));
      g.appendChild(tier);

      // 선택 모서리 꺾쇠
      if(G.selected===i){
        const brk=document.createElementNS('http://www.w3.org/2000/svg','path');
        brk.setAttribute('d',`M${cx-19} ${cy-11} v-8 h8 M${cx+11} ${cy-19} h8 v8 M${cx+19} ${cy+11} v8 h-8 M${cx-11} ${cy+19} h-8 v-8`);
        brk.setAttribute('stroke','#f2c14e');brk.setAttribute('stroke-width','2');brk.setAttribute('fill','none');
        g.appendChild(brk);
      }

      // 조합 가능 표식(구석 작은 삼각)
      if(canCombineFrom(uname)){
        const dot=document.createElementNS('http://www.w3.org/2000/svg','path');
        dot.setAttribute('d',`M${cx+13} ${cy-19} l6 0 l0 6 z`);
        dot.setAttribute('fill','#7ec8ff');

function canCombineFrom(uname){
  // uname이 재료로 쓰이는 결과가 하나라도 있으면 true
  return Object.keys(RECIPE).some(res=>RECIPE[res].includes(uname));
}

/* ===== 좀비 이동 애니메이션(트랙 순환) ===== */
const TRACK=[[30,30],[290,30],[290,446],[30,446],[30,30]]; // 바깥 고리
function trackLen(){let L=0;for(let i=0;i<TRACK.length-1;i++){L+=dist(TRACK[i],TRACK[i+1]);}return L;}
function dist(a,b){return Math.hypot(b[0]-a[0],b[1]-a[1]);}
const TRACK_TOTAL=trackLen();
function posOnTrack(t){ // t: 0~1
  let d=t*TRACK_TOTAL;
  for(let i=0;i<TRACK.length-1;i++){
    const seg=dist(TRACK[i],TRACK[i+1]);
    if(d<=seg){const r=seg?d/seg:0;return [TRACK[i][0]+(TRACK[i+1][0]-TRACK[i][0])*r, TRACK[i][1]+(TRACK[i+1][1]-TRACK[i][1])*r];}
    d-=seg;
  }
  return TRACK[0];
}

function drawZombiesInit(){
  zombieLayer.innerHTML='';

    const zt=ZTYPE[z.type];

    g.appendChild(img);

    g.appendChild(hpFill);
    zombieLayer.appendChild(g);
    return {g,img,hpFill,hpBack,size,z};
  });
}
let animT=0,lastTs=null;
function animLoop(ts){
  if(!lastTs)lastTs=ts;
  const dt=(ts-lastTs)/1000; lastTs=ts;
  if(!G.paused){
    animT+=dt*G.speed*0.05;
    zNodes.forEach(n=>{
      let t=(n.z.t0+animT*n.z.spd*10)%1;
      const [x,y]=posOnTrack(t);
      n.img.setAttribute('x',x-n.size/2);n.img.setAttribute('y',y-n.size/2);
      n.hpBack.setAttribute('x',x-n.size/2);n.hpBack.setAttribute('y',y-n.size/2-6);
      n.hpFill.setAttribute('x',x-n.size/2);n.hpFill.setAttribute('y',y-n.size/2-6);
      n.hpFill.setAttribute('width',n.size*n.z.hpPct);
    });
    // 랜덤 피해 숫자 (드물게)
    if(Math.random()<0.02*G.speed){spawnDmgFloat();}
  }
  requestAnimationFrame(animLoop);
}
function spawnDmgFloat(){
  const idx=Math.floor(Math.random()*CELL_UNIT.length);
  if(!CELL_UNIT[idx])return;
  const [cx,cy]=CELL_XY[idx];
  const layer=document.getElementById('dmgLayer');
  const el=document.createElement('div');
  el.className='dmg-float';
  const u=U[CELL_UNIT[idx]];
  el.textContent=(u.dmg||10)+(Math.random()<0.15?'!':'');
  const boardRect=document.getElementById('boardWrap').getBoundingClientRect();
  const k=Math.min(boardRect.width/320, boardRect.height/460);
  const ox=(boardRect.width-320*k)/2, oy=(boardRect.height-460*k)/2;
  el.style.left=(ox+cx*k-8)+'px';
  el.style.top=(oy+cy*k-30)+'px';
  layer.appendChild(el);
  let op=1,dy=0;
  const iv=setInterval(()=>{
    dy-=1.2;op-=0.04;
    el.style.transform=`translateY(${dy}px)`;el.style.opacity=op;
    if(op<=0){clearInterval(iv);el.remove();}
  },30);
}

function renderInfoStrip(){
  const strip=document.getElementById('infoStrip');
  if(G.selected===null || !CELL_UNIT[G.selected]){
    const zt=ZTYPE[PEEK_ZOMBIE];
    strip.innerHTML=`<div class="peek-full">
      <div class="pf-img"><img src="${ASSET_ZOMBIE(zt.file)}" alt=""></div>
      <div class="pf-txt">
        <div class="pf-name">다음 웨이브 — ${zt.name}</div>
        <div class="pf-sub">체력 ${Math.round(zt.hp*100)}% · 속도 ${zt.spd}</div>
        <div class="pf-trait">${zt.trait}</div>
      </div>
    </div>`;
    return;
  }
  const uname=CELL_UNIT[G.selected];
  const u=U[uname];
  const tier=RARITY[u.t];
  const asRate=(1000/u.cd).toFixed(1);
  const skills=SKILLS_BY[uname];
  const skillTxt=skills? SKD[skills[0]]+(skills.length>1?` · 외 ${skills.length-1}`:'') : '';

  // 상위 조합 후보: uname이 재료로 쓰이는 결과들 (최대 3개, 만들 수 있는 것 먼저)
  const candidates=Object.keys(RECIPE).filter(res=>RECIPE[res].includes(uname));
  const ownCount=n=>CELL_UNIT.filter(v=>v===n).length;
  const withReady=candidates.map(res=>{
    const need={};RECIPE[res].forEach(m=>need[m]=(need[m]||0)+1);
    const allReady=Object.keys(need).every(m=>ownCount(m)>=need[m]);
    const matTxt=Object.keys(need).map(m=>{
      const short=U[m]&&U[m].short?U[m].short:m;
      return `${short} ${Math.min(ownCount(m),need[m])}/${need[m]}`;
    }).join(' · ');
    return {res,allReady,matTxt};
  }).sort((a,b)=>(b.allReady?1:0)-(a.allReady?1:0)).slice(0,3);
  const recipeHtml=withReady.map(c=>`<div class="recipe-chip ${c.allReady?'ready':''}">
      <img src="${ASSET_UNIT(c.res)}" alt="">
      <span class="rc-name">${c.res}</span>
      <span class="rc-cnt">${c.matTxt}</span>
    </div>`).join('');

  strip.innerHTML=`
    <div class="sel-strip">
      <div class="sel-top">
        <div class="sel-portrait"><img src="${ASSET_UNIT(uname)}" alt=""></div>
        <div class="sel-main">
          <div class="sel-name-row">
            <span class="sel-name">${uname}</span>
            <span class="tier-chip" style="background:${tier.color}22;color:${tier.color};">${tier.name}</span>
          </div>
          <div class="sel-sub">${DT_NAME[u.dt]} 공격 ${u.role?'· '+u.role:''}</div>
          ${skillTxt?`<div class="sel-skill">${skillTxt}</div>`:''}
        </div>
        <div class="sel-stats">
          <div>공격력<br><b>${u.dmg}</b></div>
          <div>초당<br><b>${asRate}</b></div>
          <div>사거리<br><b>${u.range}</b></div>
        </div>
        <div class="side-actions">
          <button class="mini-btn tap" id="lockBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
          <button class="mini-btn tap" id="sellBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M9 12h6M12 9v6"/></svg></button>
        </div>
      </div>
      <div class="recipe-block">
        <div class="rb-label">상위 조합 후보</div>
        ${recipeHtml?`<div class="recipe-line">${recipeHtml}</div>`:`<div class="recipe-empty">이 유닛으로 만들 수 있는 상위 유닛 없음(최상위)</div>`}
      </div>
    </div>`;
}

function renderCmdRow(){
  const comboBtn=document.getElementById('comboBtn');
  const badge=document.getElementById('comboCntBadge');
  if(G.selected!==null && CELL_UNIT[G.selected]){
    const uname=CELL_UNIT[G.selected];
    const candidates=Object.keys(RECIPE).filter(res=>RECIPE[res].includes(uname));
    const ownCount=n=>CELL_UNIT.filter(v=>v===n).length;
    const readyCount=candidates.filter(res=>{
      const need={};RECIPE[res].forEach(m=>need[m]=(need[m]||0)+1);
      return Object.keys(need).every(m=>ownCount(m)>=need[m]);
    }).length;
    badge.textContent=readyCount;
    badge.classList.toggle('hidden',readyCount===0);
    comboBtn.classList.toggle('armed',G.comboArmed);
    comboBtn.classList.toggle('disabled',readyCount===0 && !G.comboArmed);
  } else {
    badge.classList.add('hidden');
    comboBtn.classList.remove('armed');
    comboBtn.classList.remove('disabled');
  }
}

document.getElementById('summonBtn').addEventListener('click',()=>{
  if(G.gold<10)return;
  const emptyIdx=CELL_UNIT.findIndex(v=>!v);
  if(emptyIdx<0)return;
  const pool=['K2소총수','K3기관총사수','판처파우스트','신궁사수','경계병','저격수','지정사수','박격포반'];
  const pick=pool[Math.floor(Math.random()*pool.length)];
  CELL_UNIT[emptyIdx]=pick;
  G.gold-=10;
  drawCells();updateTopbar();
});

document.getElementById('comboBtn').addEventListener('click',()=>{
  if(G.selected===null || !CELL_UNIT[G.selected])return;
  const uname=CELL_UNIT[G.selected];
  const candidates=Object.keys(RECIPE).filter(res=>RECIPE[res].includes(uname));
  const ownCount=n=>CELL_UNIT.filter(v=>v===n).length;
  const readyRes=candidates.find(res=>{
    const need={};RECIPE[res].forEach(m=>need[m]=(need[m]||0)+1);
    return Object.keys(need).every(m=>ownCount(m)>=need[m]);
  });
  if(!readyRes)return;
  if(!G.comboArmed){
    G.comboArmed=true; // 첫 클릭: 소비될 재료 표시
    renderCmdRow();
    highlightRecipeMats(readyRes);
    return;
  }
  // 두 번째 클릭: 실행
  const need={};RECIPE[readyRes].forEach(m=>need[m]=(need[m]||0)+1);
  Object.keys(need).forEach(m=>{
    let left=need[m];
    for(let i=0;i<CELL_UNIT.length && left>0;i++){
      if(CELL_UNIT[i]===m){CELL_UNIT[i]=null;left--;}
    }
  });
  const emptyIdx=CELL_UNIT.findIndex(v=>!v);
  if(emptyIdx>=0)CELL_UNIT[emptyIdx]=readyRes;
  G.selected=emptyIdx;
  G.comboArmed=false;
  drawCells();renderInfoStrip();renderCmdRow();updateTopbar();
});
function highlightRecipeMats(res){
  // 소비될 재료 칸에 잠깐 파란 테두리(간단히 재그림으로 대체)
  drawCells();
}

const LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function renderMissions(){
  const list=document.getElementById('missionList');
  const open=MISSIONS.filter(m=>m.state==='open'||m.state==='progress');
  const locked=MISSIONS.filter(m=>m.state==='locked');
  const done=MISSIONS.filter(m=>m.state==='done');
  function row(m){
    const tierColor2=RARITY[m.tier]?RARITY[m.tier].color:'#888';
    const btnTxt = m.state==='locked' ? LOCK_SVG : (m.state==='progress' ? '진행 중' : '도전');
    const btnCls = m.state==='locked' ? 'locked-btn' : '';
    const condTxt = m.state==='locked' ? '해금 조건: 이전 임무 완료' : m.cond;
    return `<div class="mrow ${m.state==='locked'?'locked':''}">
      <div class="mimg"><img src="${ASSET_ZOMBIE(m.file)}" alt=""></div>
      <div class="txt">
        <div class="line1">${m.name}<span>${m.state==='locked'?LOCK_SVG+' 잠김':(m.state==='progress'?'진행 중':'')}</span></div>
        <div class="line2">${m.trait} · <b>${m.rw}</b> · ${condTxt}</div>
      </div>
      <div class="go ${btnCls}">${btnTxt}</div>
    </div>`;
  }
  let html='';
  open.forEach(m=>html+=row(m));
  locked.forEach(m=>html+=row(m));
  if(done.length){
    html+=`<div class="mission-done-fold">완료됨 ${done.length}건 ▾</div>`;
    done.forEach(m=>{
      html+=`<div class="mrow" style="opacity:.4;">
        <div class="mimg"><img src="${ASSET_ZOMBIE(m.file)}" alt=""></div>
        <div class="txt"><div class="line1">${m.name}<span>✔ 완료</span></div>
        <div class="line2">${m.trait} · <b>${m.rw}</b></div></div>
      </div>`;
    });
  }
  list.innerHTML=html;
}
